
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ещё один момент ❤️</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="video-page">

<div class="stars" id="stars"></div>

<main class="video-screen">
    <p class="eyebrow">ЕЩЁ ОДИН КУСОЧЕК НАШЕЙ ИСТОРИИ</p>

    <h1>Люблю этот момент...</h1>

    <p class="video-description">
        Хочу, чтобы ты ещё раз его увидела ❤️
    </p>

    <div class="cinema-frame">
        <video id="ourVideo" autoplay muted playsinline controls>
            <source src="assets/video.MP4" type="video/mp4">
        </video>

        <button id="soundButton" class="sound-button">
            🔊 Включить звук
        </button>
    </div>

    <section class="video-ending">
        <div class="heart">♥</div>
        <h2>Лиза, мой котёночек...</h2>
        <p>
            Если бы мне пришлось снова выбирать,
            я бы снова выбрал тебя.
        </p>
        <div class="final-love">Я очень тебя люблю ❤️</div>

        <span class="ending-signature">ТВОЙ НАВСЕГДА</span>
    </section>
</main>

<script src="js/video.js"></script>
</body>
</html>
